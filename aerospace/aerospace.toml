config-version = 2
start-at-login = true

after-startup-command = ['exec-and-forget borders']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
automatically-unhide-macos-hidden-apps = false
accordion-padding = 15
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
persistent-workspaces = ["1", "2", "3", "4", "5"]

[gaps]
  inner.horizontal = 10
  inner.vertical =   10
  outer.left =       12
  outer.bottom =     12
  outer.top =        12
  outer.right =      12

# Keybindings are handled by Hammerspoon (~/.config/hammerspoon/init.lua),
# which shells out to the `aerospace` CLI. This lets the active/resize modes
# auto-exit back to main after a timeout. Keep this binding section empty so
# aerospace doesn't also grab these keys and double-fire.
[mode.main.binding]

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

 [[on-window-detected]]
# if.app-id = 'com.apple.Preview'
# run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'
